<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151815" />
      <stop offset="50%" stop-color="#0E100D" />
      <stop offset="100%" stop-color="#080908" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B87333" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D6A85C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B87333" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242923" />
      <stop offset="100%" stop-color="#151815" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="380" height="480" rx="16" fill="none" stroke="url(#copperGrad)" stroke-width="1.5" stroke-dasharray="6 4" />
  
  <!-- Subtle background ambient circle -->
  <circle cx="200" cy="200" r="120" fill="#B87333" fill-opacity="0.05" />
  
  <!-- Minimalist Classy Silhouette -->
  <g transform="translate(0, 40)">
    <!-- Head -->
    <circle cx="200" cy="150" r="54" fill="url(#silhouetteGrad)" stroke="#B87333" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Neck & Shoulders -->
    <path d="M 120 330 C 120 250, 160 220, 185 210 L 215 210 C 240 220, 280 250, 280 330 Z" fill="url(#silhouetteGrad)" stroke="#B87333" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
  
  <!-- Camera icon badge -->
  <g transform="translate(180, 270)">
    <rect x="0" y="0" width="40" height="28" rx="6" fill="#151815" stroke="#D6A85C" stroke-width="1.5" />
    <circle cx="20" cy="14" r="7" fill="none" stroke="#D6A85C" stroke-width="1.5" />
    <circle cx="31" cy="7" r="2" fill="#B87333" />
  </g>

  <!-- Typography Placeholder -->
  <text x="200" y="410" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#D6A85C" text-transform="uppercase">
    CO-FOUNDER PORTRAIT
  </text>
  <text x="200" y="432" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="10" letter-spacing="1.5" fill="#A7A59B">
    VM WILD EXPEDITIONS
  </text>
</svg>
